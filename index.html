<style>

:root[data-theme="dark"]{--bg:#10151c;--card:#1a212c;--ink:#e9ecf1;--mute:#9aa4b2;--line:#2b3440;--navy:#0b1f38;--navy2:#13335a;--gold:#e0b749;--gold2:#f0cf7a;--tan:#c9a05a;--ok:#5fc98a;--bad:#f0918a;--soft:#17202c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Mulish,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px}
h2,h3{margin:0 0 6px;line-height:1.25}
h2{font-size:20px;font-weight:800}h3{font-size:15px;font-weight:800}
p{margin:0 0 10px}.mute{color:var(--mute)}.sm{font-size:13px}
header{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
header .in{max-width:780px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;flex:none}
.brand b{font-size:17px;letter-spacing:.04em;color:#fff;font-weight:800}
.brand small{display:block;color:var(--gold2);font-size:11px;letter-spacing:.05em}

.tabs button{background:none;border:none;color:var(--gold2);font-weight:700;font-size:13px;letter-spacing:.03em;text-transform:uppercase;padding:6px 10px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-pressed="true"]{color:#fff;border-bottom-color:var(--gold)}
.datebar{background:var(--card);border-bottom:1px solid var(--line);padding:7px 16px;font-size:12.5px;color:var(--mute)}
.datebar .in{max-width:780px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.band{background:var(--navy);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 14px);color:var(--gold2);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.band span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardbody{padding:14px 16px}
.badge2{background:rgba(255,255,255,.14);color:#fff;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:99px;text-transform:none;letter-spacing:0;white-space:nowrap}
.hero{position:relative;border-radius:10px;overflow:hidden;margin-bottom:14px;padding:46px 16px 0;

.hero svg.arch{display:block;width:100%;height:90px}
.heroin{position:relative;z-index:2;max-width:360px;margin:-30px auto 0;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.7);border-radius:10px;padding:26px 22px 22px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.18)}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:700}

label{font-weight:700;font-size:13px;display:block;margin-bottom:4px}
.gap-up{color:var(--bad)}.gap-down{color:var(--ok)}

.dot-cal{background:var(--gold)}.dot-cu{background:var(--tan)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

.cookday{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

hr.div{border:none;border-top:1px solid var(--line);margin:12px 0}

@media (max-width:480px){
  .wrap{padding:12px}

  .brand b{font-size:15px}
  .brand small{font-size:10px}

  .datebar{padding:6px 12px;font-size:11.5px}
  .cal{gap:3px}
  .cal .day{min-height:44px;padding:3px 1px}
  .cal .dn{font-size:13px}
  .cal .hj{font-size:8.5px}
  .big{font-size:32px}
  .heroin{margin-top:-24px;padding:22px 16px 18px}
  .band{font-size:11.5px;padding:9px 12px}
  h2{font-size:18px}

@media (max-width:380px){
  .row>*{min-width:100%}
  .stats{grid-template-columns:1fr 1fr}
  .cal .day{min-height:40px}
  .cal .dn{font-size:12px}
  .cal .hj{font-size:8px}

/* Prevent any accidental horizontal scroll on small viewports */
html,body{overflow-x:hidden}
</style>

function login(){
  const v=$("its").value.trim();
  if(Date.now()<S.lock){S.err="Too many wrong attempts. Please wait a few seconds and try again.";return render()}
  const f=fam(v);
  if(!f){S.fails++;
    if(S.fails>=5){S.lock=Date.now()+20000;S.fails=0;S.err="Too many wrong attempts. Please wait 20 seconds."}
    else S.err="This ITS is not registered as a Head of Family. Please ask your HOF to respond.";
    return render()}
  S.err="";S.fails=0;S.its=v;S.step="confirm";render()
}

}

function navMonth(d){
  let m=S.hijM+d,y=S.hijY;
  if(m<0){m=11;y--}if(m>11){m=0;y++}
  if(!hijriYears.find(o=>o.y===y))return; // only 1448 and 1449 are in range
  S.hijM=m;S.hijY=y;render();
}
function pickDay(ts){S.selDate=ts;S.picked=[];S.showCustom=false;render()}

function createFromPicked(){
  const occ=eventsOnDate(S.selDate),chosen=S.picked.map(i=>occ[i]).filter(Boolean);
  if(!chosen.length)return;
  const name=chosen.map(o=>o.n).join(" & ");
  const dv=$("cf-date").value,t=$("cf-time").value||"13:00",venue=$("cf-venue").value.trim()||"Masjid, Main Hall",meal=$("cf-meal").value.trim()||"Lunch";
  if(!dv){toast("Please choose the date the jaman is actually held");return}
  const [hh,mm]=t.split(":").map(Number);
  const start=new Date(dv+"T00:00:00");start.setHours(hh,mm,0,0);
  const id=nextId++;
  evs.push({id,name,venue,meal,start:start.getTime(),src:"calendar"});
  resp[id]={};actual[id]=null;S.picked=[];S.ev=id;render();toast("Jaman event created");
}
function createCustom(){
  const name=$("cu-name").value.trim(),dv=$("cu-date").value,t=$("cu-time").value,venue=$("cu-venue").value.trim(),meal=$("cu-meal").value.trim();
  if(!name||!dv||!t||!venue){toast("Please fill in name, date, time and venue");return}
  const [hh,mm]=t.split(":").map(Number);
  const start=new Date(dv+"T00:00:00");start.setHours(hh,mm,0,0);
  const id=nextId++;
  evs.push({id,name,venue,meal:meal||"—",start:start.getTime(),src:"custom"});

}

function calendarGrid(){
  // The Hijri month is the primary grid now — it starts wherever its anchor date falls in
  // the week, runs for its real 29 or 30 days, and the Gregorian date rides along inside
  // each cell as the small sub-label. A Hijri month almost always spans parts of two
  // Gregorian months (e.g. Jamada al-Ula runs 11 Oct – 9 Nov), which is expected and correct.
  const yd=hijriYears.find(o=>o.y===S.hijY),mIdx=S.hijM;
  const anchor=yd.anchors[mIdx],len=yd.lens[mIdx];
  const startDow=new Date(anchor).getDay();
  const todayKey=dkey(now);
  const jamanByDay={};evs.forEach(e=>{(jamanByDay[dkey(e.start)]=jamanByDay[dkey(e.start)]||[]).push(e)});
  let cells="",prevGMonth=null;
  for(let i=0;i<startDow;i++)cells+=`<div class="day pad"></div>`;
  for(let day=1;day<=len;day++){
    const ts=anchor+(day-1)*D,k=dkey(ts);
    const occ=eventsOnDate(ts),jaman=jamanByDay[k]||[];
    const sel=S.selDate&&dkey(S.selDate)===k;
    const gd=new Date(ts),gMonth=gd.getMonth();
    // Show the Gregorian day alone most of the time (never wraps); only add the short
    // month name on the day it actually changes, so a phone-width cell never has to
    // wrap "12 Sept" onto a second line and spill into the row below it.
    const gLabel=gMonth!==prevGMonth?gd.toLocaleDateString("en-IN",{day:"numeric",month:"short"}):String(gd.getDate());
    prevGMonth=gMonth;
    cells+=`<div class="day${k===todayKey?' today':''}${sel?' sel':''}" onclick="pickDay(${ts})">
<span class="dn">${day}</span><span class="hj">${gLabel}</span><span class="dots">${occ.length?'<span class="dot dot-cal"></span>':""}${jaman.length?'<span class="dot dot-cu"></span>':""}</span></div>`;
  }
  const gStart=new Date(anchor),gEnd=new Date(anchor+(len-1)*D);
  const fmt=(d,withYear)=>d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:withYear?"numeric":undefined});
  const gSpan=gStart.getFullYear()===gEnd.getFullYear()?`${fmt(gStart,false)} – ${fmt(gEnd,true)}`:`${fmt(gStart,true)} – ${fmt(gEnd,true)}`;
  const monthLabel=`${hijriMonths[mIdx]} ${S.hijY}`;
  const body=`${["S","M","T","W","T","F","S"].map(d=>`<div class="dow">${d}</div>`).join("")}`;
  return card(`<span style="display:flex;align-items:center;justify-content:space-between;width:100%"><button onclick="navMonth(-1)" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 6px">‹</button><span style="text-align:center"><span class="t" style="display:block">${monthLabel}</span><span style="display:block;font-size:10.5px;color:var(--gold2);text-transform:none;letter-spacing:0;font-weight:600">${gSpan}</span></span><button onclick="navMonth(1)" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 6px">›</button></span>`,
  `<div class="cal">${body}${cells}</div><p class="mute sm" style="margin-top:10px"><span class="dot dot-cal" style="display:inline-block"></span> Fatemi calendar occasion(s) &nbsp; <span class="dot dot-cu" style="display:inline-block"></span> Jaman already created</p>`);
}

function dayPanel(){
  if(!S.selDate)return card("Select a date",`<p class="mute">Tap a date on the calendar above to see what falls on it.</p>`);
  const occ=eventsOnDate(S.selDate);
  const occBody=occ.length?
    `<p class="mute sm">Everything on this date from the Fatemi calendar. Tick the occasion(s) this jaman is for — select one, or more than one if they share the same meal.</p>`+
    occ.map((o,i)=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer">
<input type="checkbox" style="margin-top:3px;width:18px;height:18px;flex:none" ${S.picked.includes(i)?"checked":""} onchange="toggleOcc(${i})">
<span><span style="font-weight:700">${o.n}</span>${o.loc?`<br><span class="mute sm">@ ${o.loc}</span>`:""}</span></label>`).join("")
    :`<p class="mute">No occasions from the Fatemi calendar fall on ${dt(S.selDate)}.</p>`;
  const occCard=card(`Occasions on ${dt(S.selDate)}`,occBody);

  const selISO=new Date(S.selDate).toISOString().slice(0,10);
  const pickedForm=S.picked.length?card("Create jaman event",`
<p class="mute sm">Creating a jaman for: <b>${S.picked.map(i=>occ[i]?.n).filter(Boolean).join(" & ")}</b></p>
<p class="mute sm">The jaman isn't always held on the occasion's own date — adjust it below if it's the day before or after.</p>
<div class="row"><div><label for="cf-date">Date</label><input type="date" id="cf-date" value="${selISO}"></div>
<div><label for="cf-time">Time</label><input type="time" id="cf-time" value="13:00"></div></div>
<label for="cf-venue" style="margin-top:10px">Venue</label><input type="text" id="cf-venue" placeholder="Masjid, Main Hall">
<label for="cf-meal" style="margin-top:10px">Meal</label><input type="text" id="cf-meal" placeholder="Lunch / Dinner / Niyaz">
<p style="margin-top:12px"><button class="p" onclick="createFromPicked()">Create jaman event</button></p>`):"";

  const customToggle=`<p style="margin:${occ.length?"-2px":"0"} 0 0"><button class="s" onclick="S.showCustom=!S.showCustom;render()">${S.showCustom?"Cancel custom event":"+ Custom event (not on the calendar)"}</button></p>`;
  const customForm=S.showCustom?card("Custom event",`
<p class="mute sm">For a majlis, guest lecture, or anything not on the Fatemi calendar.</p>
<label for="cu-name">Event name</label><input type="text" id="cu-name" placeholder="e.g. Hafiz-ul-Quran Majlis">
<div class="row" style="margin-top:10px"><div><label for="cu-date">Date</label><input type="date" id="cu-date" value="${selISO}"></div>
<div><label for="cu-time">Time</label><input type="time" id="cu-time"></div></div>
<label for="cu-venue" style="margin-top:10px">Venue</label><input type="text" id="cu-venue" placeholder="Masjid, Main Hall">
<label for="cu-meal" style="margin-top:10px">Meal (optional)</label><input type="text" id="cu-meal" placeholder="Lunch / Dinner / Niyaz — leave blank if none">
<p style="margin-top:12px"><button class="p" onclick="createCustom()">Create event</button></p>`):"";

  const k=dkey(S.selDate),dayEvs=evs.filter(e=>dkey(e.start)===k).sort((a,b)=>a.start-b.start);
  const createdBlock=dayEvs.length?dayEvs.map(e=>{
    const expanded=S.ev===e.id;
    const body=`<span class="mute sm">${tm(e.start)} · ${e.venue}</span>`
    +(expanded?eventDashboard(e):`<p class="mute sm" style="margin-top:8px"><button class="s" onclick="S.ev=${e.id};render()">View RSVP details →</button></p>`);
    return card(e.name,body,e.src==="calendar"?"Calendar":"Custom");
  }).join(""):"";

  return occCard+pickedForm+customToggle+customForm+createdBlock;
}

function eventDashboard(e){
  const R=resp[e.id],rows=Object.values(R);
  const M=rows.reduce((s,r)=>s+r.m,0),G=rows.reduce((s,r)=>s+r.g,0),T=M+G;
  const cook=Math.ceil(T*(1+S.buf/100)/S.per);
  const act=actual[e.id],gap=act!=null?act-T:null,gapPct=act!=null&&T>0?Math.round(gap/T*100):null;
  return `<hr class="div">
<div class="stats"><div class="card"><div class="cardbody"><div class="big" style="font-size:26px">${T}</div><div class="mute sm">RSVP'd</div></div></div>
<div class="card"><div class="cardbody"><div class="big" style="font-size:26px">${cook}</div><div class="mute sm">Thaals (+${S.buf}%)</div></div></div>
<div class="card"><div class="cardbody"><div class="big" style="font-size:26px">${rows.length}/${fams.length}</div><div class="mute sm">Households</div></div></div></div>
<p class="mute sm" style="margin-top:-4px;margin-bottom:12px">${M} members · ${G} mehmaan</p>
<div class="row"><div><label for="act">Actual attendance (after event)</label><input type="number" id="act" min="0" value="${act!=null?act:''}" placeholder="e.g. 70"></div>
<div style="display:flex;align-items:flex-end"><button class="p" style="width:100%" onclick="saveActual(${e.id})">Save</button></div></div>
${act!=null?`<p class="sm ${gap>0?'gap-up':gap<0?'gap-down':''}" style="margin-top:8px">Gap vs RSVP: ${gap>0?'+':''}${gap} (${gapPct>0?'+':''}${gapPct}%)</p>`:""}
<p style="margin-top:10px"><button class="s" onclick="S.ev=null;render()">Collapse</button></p>`;
}

function adminView(){
  return `<h2>Admin dashboard</h2><p class="mute sm">In the real system this page sits behind an admin login.</p>
${calendarGrid()}${dayPanel()}
${card("Thaal settings",`<p class="mute sm">Used across the calendar and the cook's view.</p><div class="row"><div><label for="per">People per thaal</label><input type="number" id="per" min="1" value="${S.per}" onchange="S.per=Math.max(1,+this.value||8);render()"></div>
<div><label for="buf">Buffer for walk-ins (%)</label><input type="number" id="buf" min="0" value="${S.buf}" onchange="S.buf=Math.max(0,+this.value||0);render()"></div></div>`)}
${card("Change log",log.length?`<div class="tw"><table><tr><th>Time</th><th>Event</th><th>Change</th></tr>${log.slice(0,8).map(l=>`<tr><td>${tm(l.t)}</td><td>${l.ev}</td><td>${l.from===null?"New: "+l.to:l.from+" → "+l.to}</td></tr>`).join("")}</table></div>`:`<p class="mute sm">No changes yet.</p>`)}`;
}

// ---- Cook view ----
function cookView(){
  const byDay={};
  evs.forEach(e=>{const k=dkey(e.start);const R=resp[e.id];const t=Object.values(R).reduce((s,r)=>s+tot(r),0);
    byDay[k]=byDay[k]||{date:e.start,total:0};byDay[k].total+=t;if(e.start<byDay[k].date)byDay[k].date=e.start});
  const list=Object.values(byDay).filter(d=>d.date>now-D).sort((a,b)=>a.date-b.date);
  const rows=list.length?list.map(d=>{
    const cook=Math.ceil(d.total*(1+S.buf/100)/S.per);
    return `<div class="cookday"><div><div style="font-weight:800;font-size:16px">${dt(d.date)}</div><div class="mute sm">${d.total} people RSVP'd</div></div><div style="text-align:right"><div class="big">${cook}</div><div class="mute sm">thaals</div></div></div>`;
  }).join(""):`<p class="mute">No upcoming dates yet.</p>`;
  return `<h2>Kitchen view</h2><p class="mute sm">Just the date and how many thaals to prepare — nothing else to track.</p>
${card("Settings",`<div class="row"><div><label for="per2">People per thaal</label><input type="number" id="per2" min="1" value="${S.per}" onchange="S.per=Math.max(1,+this.value||8);render()"></div>
<div><label for="buf2">Buffer %</label><input type="number" id="buf2" min="0" value="${S.buf}" onchange="S.buf=Math.max(0,+this.value||0);render()"></div></div>`)}
${card("Upcoming thaal count",rows)}`;
}

function render(){$("app").innerHTML=S.tab==="fam"?famView():S.tab==="cook"?cookView():adminView()}
render();
</script>
</body>
</html>
